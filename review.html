<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Flag Review</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 24px; max-width: 1400px; margin: 0 auto; }
    h1 { color: #ffd700; margin-bottom: 4px; }
    .meta { color: #888; font-size: 13px; margin-bottom: 24px; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    button { background: #222; color: #eee; border: 1px solid #444; padding: 7px 14px; cursor: pointer; font-family: monospace; font-size: 13px; border-radius: 4px; }
    button:hover { background: #333; }
    button.danger { border-color: #b00; color: #f88; }
    button.danger:hover { background: #2a0000; }
    .empty { color: #666; font-size: 15px; padding: 40px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    th { text-align: left; padding: 8px 10px; background: #1a1a1a; color: #ffd700; border-bottom: 1px solid #333; white-space: nowrap; overflow: hidden; }
    th:nth-child(1)  { width: 35px; }
    th:nth-child(2)  { width: 50px; }
    th:nth-child(3)  { width: 95px; }
    /* th:nth-child(4) = Question: fills remaining space */
    th:nth-child(5)  { width: 155px; }
    th:nth-child(6)  { width: 65px; }
    th:nth-child(7)  { width: 80px; }
    th:nth-child(8)  { width: 75px; }
    th:nth-child(9)  { width: 155px; }
    th:nth-child(10) { width: 135px; }
    th:nth-child(11) { width: 145px; }
    td { padding: 10px 10px; border-bottom: 1px solid #222; vertical-align: top; overflow-wrap: break-word; word-break: break-word; }
    tr:hover td { background: #1a1a1a; }
    .q-id    { color: #888; }
    .q-shard { color: #94a3b8; font-size: 11px; white-space: nowrap; }
    .q-text  { color: #fff; }
    .q-ans   { color: #4ade80; }
    .q-diff  { white-space: nowrap; }
    .q-cat   { color: #a78bfa; white-space: nowrap; }
    .q-who   { color: #60a5fa; white-space: nowrap; }
    .q-time  { color: #888; white-space: nowrap; font-size: 11px; }
    .q-note  { color: #fbbf24; font-style: italic; }
    .badge-easy   { color: #4ade80; }
    .badge-medium { color: #fbbf24; }
    .badge-hard   { color: #f87171; }
    .actions td { padding: 12px 10px; }
    .resolved { opacity: 0.35; }
    .tag-resolved { color: #888; font-size: 11px; }
    #json-out { display: none; background: #1a1a1a; border: 1px solid #333; padding: 16px; font-size: 12px; overflow-x: auto; white-space: pre; margin-top: 16px; color: #ccc; border-radius: 4px; }
  </style>
</head>
<body>
<h1>🚩 Flag Review</h1>
<p class="meta">Flagged questions submitted by players. Reads from Firestore — works from any device.</p>

<div class="controls">
  <button onclick="loadFlags()">↻ Refresh</button>
  <button onclick="exportJSON()">⬇ Export JSON</button>
  <button onclick="clearResolved()">✓ Remove Resolved</button>
  <button class="danger" onclick="clearAll()">✕ Clear All Flags</button>
</div>

<div id="output"><p class="meta">Loading…</p></div>
<pre id="json-out"></pre>

<hr style="border:none;border-top:1px solid #333;margin:36px 0 24px;">
<h2 style="color:#ffd700;margin-bottom:4px;">👥 Users &amp; Score Reset</h2>
<p class="meta">Reset stats, points, streaks, and daily history for one or all players.</p>
<div class="controls">
  <button onclick="loadUsers()">↻ Refresh Users</button>
  <button class="danger" onclick="resetAllUsers()">⚠ Reset ALL Scores</button>
</div>
<div class="controls">
  <button onclick="downloadBackup()">Download full data backup</button>
  <label>Restore player stats from backup <input id="restore-file" type="file" accept="application/json,.json"></label>
  <button onclick="exportDifficultyReport()">Export difficulty recommendations</button>
</div>
<p id="admin-status" role="status" aria-live="polite"></p>
<div id="users-output"><p class="meta">Loading…</p></div>

<!-- Firebase compat SDK (same version as storage.js) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="game-logic.js?v=1.39"></script>
<script src="data-logic.js?v=1.39"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyC_keHyGc1Z46rzqB9wNKJ36wZgHscfGrQ",
  authDomain:        "disneytrivia-38ac6.firebaseapp.com",
  projectId:         "disneytrivia-38ac6",
  storageBucket:     "disneytrivia-38ac6.firebasestorage.app",
  messagingSenderId: "817552679289",
  appId:             "1:817552679289:web:1e82c3f0c72eeed2020fa8"
});
const db = firebase.firestore();

let cachedFlags = [];

// Exact question-id → shard filename map, built from the live manifest. Shard ID
// ranges aren't uniform (q-003 spans 501–799), so computing the shard from the id
// mislabels some questions — look it up instead.
let shardMap = null;

async function buildShardMap() {
  try {
    const manifest = await fetch('questions/manifest.json', { cache: 'no-cache' }).then(r => r.json());
    const entries = await Promise.all(manifest.shards.map(async s => {
      const qs = await fetch(s, { cache: 'no-cache' }).then(r => r.json());
      const file = s.split('/').pop();
      return qs.map(q => [q.id, file]);
    }));
    shardMap = new Map(entries.flat());
  } catch (e) {
    shardMap = null; // shard column shows '?' — flags still fully usable
  }
}

function shardFor(qid) {
  if (!shardMap) return '?';
  return shardMap.get(qid) || 'removed';
}

async function fetchFlags() {
  const snap = await db.collection('flags').get();
  return snap.docs.map(d => ({ _docId: d.id, ...d.data() }));
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) + ' ' +
           d.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'});
  } catch { return iso || '—'; }
}

async function resolveFlag(docId) {
  await db.collection('flags').doc(decodeURIComponent(docId)).update({ _resolved: true });
  loadFlags();
}

async function unresolveFlag(docId) {
  await db.collection('flags').doc(decodeURIComponent(docId)).update({ _resolved: firebase.firestore.FieldValue.delete() });
  loadFlags();
}

async function deleteFlag(docId) {
  await db.collection('flags').doc(decodeURIComponent(docId)).delete();
  loadFlags();
}

async function clearResolved() {
  if (!confirm('Remove all resolved flags?')) return;
  const flags = await fetchFlags();
  const batch = db.batch();
  flags.filter(f => f._resolved).forEach(f => batch.delete(db.collection('flags').doc(f._docId)));
  await batch.commit();
  loadFlags();
}

async function clearAll() {
  if (!confirm('Delete ALL flags? This cannot be undone.')) return;
  const flags = await fetchFlags();
  const batch = db.batch();
  flags.forEach(f => batch.delete(db.collection('flags').doc(f._docId)));
  await batch.commit();
  loadFlags();
}

function exportJSON() {
  const el = document.getElementById('json-out');
  if (el.style.display === 'none' || el.style.display === '') {
    el.style.display = 'block';
    el.textContent = JSON.stringify(cachedFlags, null, 2);
  } else {
    el.style.display = 'none';
  }
}

async function loadFlags() {
  const out = document.getElementById('output');
  out.innerHTML = '<p class="meta">Loading…</p>';

  const flags = await fetchFlags();
  flags.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0)); // newest first
  cachedFlags = flags;

  if (flags.length === 0) {
    out.innerHTML = '<p class="empty">No flags yet — looks like the questions are all good! 🎉</p>';
    return;
  }

  const pending  = flags.filter(f => !f._resolved).length;
  const resolved = flags.length - pending;

  let html = `<p class="meta">${flags.length} total &nbsp;·&nbsp; ${pending} pending &nbsp;·&nbsp; ${resolved} resolved</p>`;
  html += '<table><thead><tr>';
  html += '<th>#</th><th>Q ID</th><th>Shard</th><th>Question</th><th>Correct Answer</th><th>Diff</th><th>Cat</th><th>By</th><th>Comment</th><th>Date</th><th>Action</th>';
  html += '</tr></thead><tbody>';

  flags.forEach((f, i) => {
    const rowClass = f._resolved ? ' class="resolved"' : '';
    const diffClass = `badge-${['easy','medium','hard'].includes(f.difficulty) ? f.difficulty : 'easy'}`;
    const docId = encodeURIComponent(f._docId).replace(/'/g,'%27');
    html += `<tr${rowClass}>`;
    html += `<td class="q-id">${i + 1}</td>`;
    html += `<td class="q-id">${esc(f.questionId)}</td>`;
    html += `<td class="q-shard">${shardFor(f.questionId)}</td>`;
    html += `<td class="q-text">${esc(f.questionText)}</td>`;
    html += `<td class="q-ans">${esc(f.correctAnswer)}</td>`;
    html += `<td class="${diffClass}">${esc(f.difficulty || '—')}</td>`;
    html += `<td class="q-cat">${esc(f.category || '—')}</td>`;
    html += `<td class="q-who">${esc(f.reportedBy || '—')}</td>`;
    html += `<td class="q-note">${f.comment ? esc(f.comment) : '<span style="color:#444">—</span>'}</td>`;
    html += `<td class="q-time">${formatDate(f.timestamp)}</td>`;
    html += `<td style="white-space:nowrap">`;
    if (f._resolved) {
      html += `<span class="tag-resolved">✓ resolved</span> `;
      html += `<button onclick="unresolveFlag('${docId}')">Undo</button> `;
    } else {
      html += `<button onclick="resolveFlag('${docId}')">✓ Resolve</button> `;
    }
    html += `<button class="danger" onclick="deleteFlag('${docId}')">Delete</button>`;
    html += `</td></tr>`;
  });

  html += '</tbody></table>';
  out.innerHTML = html;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// =============================================================================
// Users & Score Reset
// =============================================================================
let cachedUsers = [];
let adminBusy=false;
async function fetchUsers() {
  const snap=await db.collection('users').get();
  return snap.docs.map(d=>({_docId:d.id,...d.data()}));
}
async function adminAction(action) {
  if(adminBusy) return;
  adminBusy=true; document.getElementById('admin-status').textContent='Saving…';
  try { await action(); document.getElementById('admin-status').textContent='Saved ✓'; await loadUsers(); }
  catch(e) { document.getElementById('admin-status').textContent='Could not finish: '+e.message; }
  finally { adminBusy=false; }
}
async function resetPlayer(id) {
  const ref=db.collection('users').doc(id),backup=ref.collection('backups').doc();
  await db.runTransaction(async tx=>{
    const snap=await tx.get(ref);if(!snap.exists)throw new Error('Player not found.');
    const user=snap.data();
    tx.set(backup,{at:new Date().toISOString(),user});
    tx.set(ref,scoreReset(user));
  });
}
async function resetUser(idx) {
  const u=cachedUsers[idx];if(!u)return;
  if(!confirm(`Reset all scores for ${u.name}? A recoverable snapshot will be kept. Existing unfinished games will be invalidated.`))return;
  await adminAction(()=>resetPlayer(u._docId));
}
async function resetAllUsers() {
  if(!confirm('Reset all scores for every player? A recoverable snapshot will be kept for each player. Existing unfinished games will be invalidated.'))return;
  await adminAction(async()=>{for(const u of await fetchUsers())await resetPlayer(u._docId);});
}
async function restoreLastReset(idx) {
  const u=cachedUsers[idx];if(!u)return;
  if(!confirm(`Restore ${u.name}'s latest pre-reset snapshot? Scores earned since that reset will be replaced.`))return;
  await adminAction(async()=>{
    const ref=db.collection('users').doc(u._docId);
    const list=await ref.collection('backups').orderBy('at','desc').limit(1).get();
    if(list.empty)throw new Error('No reset snapshot exists for this player.');
    const backup=ref.collection('backups').doc();
    await db.runTransaction(async tx=>{
      const [live,saved]=await Promise.all([tx.get(ref),tx.get(list.docs[0].ref)]);
      if(!saved.exists)throw new Error('Snapshot no longer exists.');
      tx.set(backup,{at:new Date().toISOString(),user:live.data()});
      tx.set(ref,{...saved.data().user,id:live.data().id,name:live.data().name,resetRevision:(live.data().resetRevision||0)+1});
    });
  });
}
function downloadJSON(value,name) {
  const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function downloadBackup() {
  if(adminBusy)return;
  adminBusy=true;document.getElementById('admin-status').textContent='Preparing backup…';
  try {
    const backup={schema:1,at:new Date().toISOString(),users:await fetchUsers(),games:{},dailies:[],flags:[],homework:null};
    for(const u of backup.users)backup.games[u._docId]=(await db.collection('users').doc(u._docId).collection('games').get()).docs.map(d=>({id:d.id,...d.data()}));
    backup.dailies=(await db.collection('dailies').get()).docs.map(d=>({id:d.id,...d.data()}));
    backup.flags=await fetchFlags();
    const hw=await db.collection('weeklyHomework').doc('state').get();backup.homework=hw.exists?hw.data():null;
    downloadJSON(backup,'disney-trivia-backup-'+backup.at.slice(0,10)+'.json');
    document.getElementById('admin-status').textContent='Backup downloaded.';
  } catch(e) {document.getElementById('admin-status').textContent='Backup failed: '+e.message;}
  finally {adminBusy=false;}
}
document.getElementById('restore-file').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try {
    if(file.size>20*1024*1024)throw new Error('Backup is too large.');
    const data=JSON.parse(await file.text());
    if(data.schema!==1 || !Array.isArray(data.users) || !data.users.length || data.users.length>100)throw new Error('Unsupported backup format.');
    const ids=new Set();
    for(const u of data.users) {
      if(!validPlayerBackup(u))throw new Error('Invalid player stats in backup. Nothing was changed.');
      if(typeof u.id!=='string' || !u.id || u.id.includes('/') || u.id==='__proto__' || ids.has(u.id) || typeof u.name!=='string' || !u.name.trim() || u.name.length>20)throw new Error('Invalid or duplicate player in backup.');
      ids.add(u.id);
      for(const key of ['totalAnswered','totalCorrect','gamesPlayed','totalPoints'])if(!Number.isSafeInteger(u[key])||u[key]<0)throw new Error('Invalid score counters in backup.');
      if(u.totalCorrect>u.totalAnswered)throw new Error('Invalid accuracy in backup.');
    }
    if(!confirm(`Restore player stats for ${data.users.length} players from ${data.at}? Current stats will be backed up first. Daily question pins and flags will stay unchanged.`))return;
    await adminAction(async()=>{
      for(const saved of data.users) {
        const {_docId,...user}=saved;
        const ref=db.collection('users').doc(user.id),backup=ref.collection('backups').doc();
        await db.runTransaction(async tx=>{
          const live=await tx.get(ref);
          if(!live.exists)throw new Error('Create this player before restoring their stats: '+user.name);
          if(live.exists)tx.set(backup,{at:new Date().toISOString(),user:live.data()});
          tx.set(ref,{...user,resetRevision:Math.max(user.resetRevision||0,live.data()?.resetRevision||0)+1});
        });
      }
    });
  } catch(error) {document.getElementById('admin-status').textContent='Restore failed: '+error.message;}
  finally {e.target.value='';}
});
async function exportDifficultyReport() {
  try {
    const users=await fetchUsers(),totals={};
    for(const u of users)for(const [id,stat] of Object.entries(u.questionStats||{})) {
      const t=totals[id] ||= {answered:0,correct:0};t.answered+=stat.answered;t.correct+=stat.correct;
    }
    const report=Object.entries(totals).filter(([,s])=>s.answered>=20).map(([id,s])=>({id:Number(id),...s,
      accuracy:s.correct/s.answered,suggestedDifficulty:s.correct/s.answered>=0.8?'easy':s.correct/s.answered>=0.45?'medium':'hard'}));
    downloadJSON({minimumAnswers:20,questions:report},'difficulty-review.json');
    document.getElementById('admin-status').textContent=report.length+' questions have enough answers for review. Recommendations do not change questions automatically.';
  }catch(e){document.getElementById('admin-status').textContent=e.message;}
}

async function loadUsers() {
  const out = document.getElementById('users-output');
  out.innerHTML = '<p class="meta">Loading…</p>';
  const users = await fetchUsers();
  cachedUsers = users;
  if (!users.length) {
    out.innerHTML = '<p class="empty">No users found.</p>';
    return;
  }
  let html = '<table><thead><tr>';
  html += '<th>Name</th><th>Games</th><th>Questions</th><th>Correct %</th><th>Points</th><th>Streak</th><th>Last Daily</th><th>Action</th>';
  html += '</tr></thead><tbody>';
  users.forEach((u, i) => {
    const pct = u.totalAnswered ? Math.round(u.totalCorrect / u.totalAnswered * 100) + '%' : '—';
    const pts = (u.totalPoints || 0).toLocaleString();
    html += `<tr>
      <td style="color:#fff;font-weight:bold">${esc(u.name)}</td>
      <td>${u.gamesPlayed || 0}</td>
      <td>${u.totalAnswered || 0}</td>
      <td>${pct}</td>
      <td style="color:#ffd700">${pts}</td>
      <td>${u.dailyStreak ? '🔥 ' + u.dailyStreak : '—'}</td>
      <td style="color:#888;font-size:11px">${esc(u.lastDailyDate || '—')}</td>
      <td><button class="danger" onclick="resetUser(${i})">Reset</button> <button onclick="restoreLastReset(${i})">Undo reset</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  out.innerHTML = html;
}

window.addEventListener('unhandledrejection',event=>{
  event.preventDefault();document.getElementById('admin-status').textContent='Request failed. Check your connection and retry.';
});
buildShardMap().then(loadFlags).catch(()=>{document.getElementById('output').textContent='Could not load flags. Retry with Refresh.';});
loadUsers().catch(()=>{document.getElementById('users-output').textContent='Could not load players. Retry with Refresh Users.';});
</script>
</body>
</html>
